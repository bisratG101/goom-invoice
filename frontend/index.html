<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goom Invoice — Invoicing &amp; Automated Payments in ETB and USD</title>
    <meta
      name="description"
      content="Create professional invoices in seconds, share secure unguessable links, and collect payments in ETB and USD with automated webhook confirmation."
    />
    <link rel="canonical" href="https://goominvoice.com/" />
    <meta name="theme-color" content="#0B0B0C" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://goominvoice.com/" />
    <meta property="og:title" content="Goom Invoice — Invoicing &amp; Automated Payments in ETB and USD" />
    <meta
      property="og:description"
      content="Create professional invoices in seconds, share secure unguessable links, and collect payments in ETB and USD with automated webhook confirmation."
    />
    <meta property="og:image" content="https://goominvoice.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Goom Invoice — Professional Invoicing and Payments" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Goom Invoice — Invoicing &amp; Automated Payments in ETB and USD" />
    <meta
      name="twitter:description"
      content="Create professional invoices in seconds, share secure unguessable links, and collect payments in ETB and USD with automated webhook confirmation."
    />
    <meta name="twitter:image" content="https://goominvoice.com/og-image.png" />

    <!-- Fonts: Plus Jakarta Sans (600, 700, 800) and Inter (400, 500, 600) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply theme before paint to prevent flashing
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-surface text-ink-900 font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
